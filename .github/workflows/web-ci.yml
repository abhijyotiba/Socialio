name: Web CI

# Only triggers when files inside web/ actually change.
# Netlify handles its own build + deploy automatically via its GitHub integration
# (no deploy step needed here).
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/web-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/web-ci.yml'

jobs:
  check:
    name: Typecheck + Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder

      - name: Test
        run: pnpm test

      # Catches SSR/RSC boundary bugs that typecheck alone misses (e.g. a
      # client-only API touched from a Server Component). Netlify runs its own
      # build on deploy; this gives faster feedback on PRs.
      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          WORKER_URL: http://placeholder.local
          WORKER_SHARED_SECRET: placeholder
